#Shows up on Page
    <body>
       #Parent-child relationship to create top section (showcase of page) hero showcase
        <section class="hero">
            
            <div class="slide active">
               
            </div>

            <div class="slide">
               
            </div>

            <div class="company-name">
                <h1>Alan's Land Surveying</h1>
            </div>

        </section>



        #Javascript to make hero section change every 4 seconds
        <script>
            let slides = document.querySelectorAll(".slide");
            let currentSlide = 0;

            function changeSlide() {
                slides[currentSlide].classList.remove("active");

                currentSlide++;

                if (currentSlide >= slides.length) {
                    currentSlide = 0;
                }

            slides[currentSlide].classList.add("active");
            }

            setInterval(changeSlide, 4000);
        </script>


    </body>
</html>
